<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화성 축구장 빈 시간</title>
<!-- 배포한 Cloudflare Worker 주소. 비워두면 같은 서버(로컬 node server.mjs)의 /api를 씀 -->
<meta name="api-base" content="https://yeyak-finder.kfriendship.workers.dev">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F5F7F2;
    --ink: #17261C;
    --muted: #5E6B62;
    --line: #D6DCD4;
    --turf: #2E7A4B;
    --turf-deep: #1F5A36;
    --booked: #DDE2DB;
    --flag: #E9B419;
    --row: 44px;
    --name: 220px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 15px/1.55 "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-variant-numeric: tabular-nums;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 26px; line-height: 1.2; margin: 0 0 4px; font-weight: 700; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .notice { margin: 0 0 28px; padding: 12px 16px; border-left: 3px solid var(--flag); background: #fff; border-radius: 0 8px 8px 0; font-size: 14px; }
  .notice ol { margin: 4px 0 0; padding-left: 20px; }

  form.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-bottom: 12px; }
  label.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  input, select, button { font: inherit; color: inherit; }
  input[type=date], select {
    height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff;
  }
  .range { display: flex; align-items: center; gap: 6px; }
  button.primary {
    height: 42px; padding: 0 22px; border: 0; border-radius: 8px; background: var(--turf-deep); color: #fff; font-weight: 500; cursor: pointer;
  }
  button.primary:disabled { opacity: .55; cursor: progress; }
  :focus-visible { outline: 2px solid var(--flag); outline-offset: 2px; }

  details.pick { margin-bottom: 28px; }
  details.pick summary { cursor: pointer; color: var(--muted); font-size: 14px; width: fit-content; }
  .pick-body { margin-top: 10px; padding: 14px; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
  .pick-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .pick-tools input { height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; flex: 1 1 180px; }
  .pick-tools button { height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); cursor: pointer; font-size: 13px; }
  .pick-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 4px 16px; max-height: 260px; overflow: auto; }
  .pick-list label { display: flex; gap: 8px; align-items: center; font-size: 14px; padding: 2px 0; }
  .pick-list label.hide { display: none; }

  .verdict { margin: 0 0 6px; font-size: 20px; font-weight: 700; line-height: 1.35; }
  .verdict-list { margin: 0 0 8px; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
  .verdict-list a {
    display: inline-block; padding: 6px 12px; border-radius: 999px; background: var(--turf); color: #fff; text-decoration: none; font-weight: 500; font-size: 14px;
  }
  .verdict-list a:hover { background: var(--turf-deep); }
  .status { color: var(--muted); font-size: 13px; min-height: 1.5em; margin: 0 0 20px; }
  .error { color: #9B2C1F; }

  /* 시간표: 이 페이지의 주인공 */
  .board { overflow-x: auto; border-top: 2px solid var(--ink); }
  .grid { display: grid; min-width: 760px; }
  .axis, .row { display: grid; grid-template-columns: var(--name) repeat(var(--cols), 1fr); align-items: stretch; }
  .axis { position: sticky; top: 0; background: var(--paper); z-index: 2; height: 34px; }
  .axis span { font-size: 12px; color: var(--muted); padding: 8px 0 0 4px; border-left: 1px solid var(--line); position: relative; }
  .axis span.in { color: var(--ink); font-weight: 500; }
  .axis span.in::before { content: ""; position: absolute; left: -1px; right: 0; top: 0; height: 4px; background: var(--flag); }
  .row { height: var(--row); border-bottom: 1px solid var(--line); }
  .row .name {
    position: sticky; left: 0; background: var(--paper); z-index: 1;
    display: flex; align-items: center; gap: 6px; padding-right: 10px; font-size: 14px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .row .name a { color: inherit; text-decoration: none; overflow: hidden; text-overflow: ellipsis; }
  .row .name a:hover { text-decoration: underline; }
  .row.full .name { font-weight: 700; }
  .row.full .name::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--turf); }
  .row.dim { opacity: .62; }
  .cell { margin: 7px 2px; border-radius: 4px; position: relative; }
  .cell.open { background: var(--turf); }
  .cell.open::after { /* 터치라인 느낌의 흰 선 */
    content: ""; position: absolute; inset: 3px; border: 1px solid rgba(255,255,255,.45); border-radius: 2px;
  }
  .cell.booked { background: var(--booked); }
  .cell.closed { background: repeating-linear-gradient(135deg, var(--booked) 0 4px, transparent 4px 8px); }
  .cell.other { background: var(--booked); outline: 1px dashed var(--muted); outline-offset: -1px; }
  .cell.pending { background: transparent; border: 1px dashed var(--line); }
  .cell.in { box-shadow: 0 0 0 2px var(--paper), 0 0 0 3px var(--flag); }

  .legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .legend i { display: inline-block; width: 22px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }

  .empty { padding: 40px 0; color: var(--muted); }

  @media (max-width: 640px) {
    :root { --name: 140px; }
    h1 { font-size: 22px; }
    .verdict { font-size: 18px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .row { animation: in .25s ease-out; }
    @keyframes in { from { opacity: 0; } }
  }
</style>
</head>
<body>
<main>
  <h1>화성 축구장 빈 시간</h1>
  <p class="sub">날짜와 시간대를 고르면 그 시간 내내 비어 있는 구장을 찾아요.</p>
  <aside class="notice">
    <strong>※ 예약접수일시</strong>
    <ol>
      <li>관내 단체 : 전월 25일 오전 10시 ~</li>
      <li>관내 개인 : 전월 28일 오전 10시 ~</li>
      <li>관외 개인 : 당월 7일 오전 10시 ~</li>
    </ol>
  </aside>

  <form class="controls" id="form">
    <label class="field">날짜
      <input type="date" id="date" required>
    </label>
    <div class="field">
      <span>시간</span>
      <div class="range">
        <select id="from" aria-label="시작 시간"></select>
        <span aria-hidden="true">–</span>
        <select id="to" aria-label="끝 시간"></select>
      </div>
    </div>
    <button class="primary" id="go" type="submit">빈 구장 찾기</button>
  </form>

  <details class="pick" id="pick">
    <summary id="pickSummary">구장 불러오는 중…</summary>
    <div class="pick-body">
      <div class="pick-tools">
        <input type="search" id="filter" placeholder="구장 이름으로 거르기">
        <button type="button" id="all">모두 선택</button>
        <button type="button" id="none">모두 해제</button>
      </div>
      <div class="pick-list" id="pickList"></div>
    </div>
  </details>

  <section aria-live="polite">
    <p class="verdict" id="verdict"></p>
    <ul class="verdict-list" id="verdictList"></ul>
    <p class="status" id="status"></p>
  </section>

  <div class="board" id="board" hidden>
    <div class="grid" id="grid"></div>
  </div>
  <div class="legend" id="legend" hidden>
    <span><i style="background:var(--turf)"></i>예약 가능</span>
    <span><i style="background:var(--booked)"></i>예약됨</span>
    <span><i style="background:repeating-linear-gradient(135deg,var(--booked) 0 3px,transparent 3px 6px)"></i>운영 안 함</span>
    <span><i style="background:var(--flag);height:4px;vertical-align:3px"></i>찾는 시간대</span>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const API_BASE = (() => {
  const v = document.querySelector('meta[name=api-base]')?.content ?? '';
  // 로컬에서 열면 로컬 서버 사용
  return location.hostname === 'localhost' || v.includes('YOUR_SUBDOMAIN') ? '' : v.replace(/\/$/, '');
})();
const DETAIL = (idx) => `https://yeyak.hscity.go.kr/1053/3026/stadiumDetail.do?stadiumIdx=${idx}`;
const toMin = (s) => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
const hh = (h) => `${String(h).padStart(2, '0')}:00`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

let stadiums = [];
let controller = null;

// ── 입력 초기화 ───────────────────────────────────────
(function initInputs() {
  const today = new Date();
  const local = new Date(today.getTime() - today.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  $('date').value = store.get('date', null) >= local ? store.get('date') : local;
  $('date').min = local;
  for (let h = 6; h <= 22; h++) {
    if (h < 22) $('from').add(new Option(hh(h), hh(h)));
    if (h > 6) $('to').add(new Option(hh(h), hh(h)));
  }
  $('from').value = store.get('from', '18:00');
  $('to').value = store.get('to', '22:00');
})();

// ── 구장 목록 ─────────────────────────────────────────
async function loadStadiums() {
  try {
    const res = await fetch('stadiums.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error();
    stadiums = await res.json();
  } catch {
    $('pickSummary').textContent = '구장 목록(stadiums.json)을 못 불러왔어요. 새로고침해주세요.';
    $('pickSummary').classList.add('error');
    return;
  }
  const saved = new Set(store.get('ids', stadiums.map((s) => s.idx)));
  $('pickList').innerHTML = '';
  for (const s of stadiums) {
    const l = document.createElement('label');
    l.dataset.name = s.name;
    l.innerHTML = `<input type="checkbox" value="${s.idx}"><span></span>`;
    l.querySelector('span').textContent = s.name;
    l.querySelector('input').checked = saved.has(s.idx);
    $('pickList').append(l);
  }
  updatePickSummary();
}
const selectedIds = () => [...$('pickList').querySelectorAll('input:checked')].map((i) => i.value);
function updatePickSummary() {
  const n = selectedIds().length;
  $('pickSummary').classList.remove('error');
  $('pickSummary').textContent = `구장 ${stadiums.length}곳 중 ${n}곳에서 찾기 · 바꾸기`;
  store.set('ids', selectedIds());
}
$('pickList').addEventListener('change', updatePickSummary);
$('filter').addEventListener('input', (e) => {
  const q = e.target.value.trim();
  for (const l of $('pickList').children) l.classList.toggle('hide', q && !l.dataset.name.includes(q));
});
$('all').onclick = () => { for (const l of $('pickList').children) if (!l.classList.contains('hide')) l.querySelector('input').checked = true; updatePickSummary(); };
$('none').onclick = () => { for (const l of $('pickList').children) if (!l.classList.contains('hide')) l.querySelector('input').checked = false; updatePickSummary(); };

// ── 판정 ──────────────────────────────────────────────
function fullyOpen(slots, from, to) {
  const hit = slots.filter((s) => toMin(s.begin) < to && toMin(s.end) > from).sort((a, b) => toMin(a.begin) - toMin(b.begin));
  if (!hit.length || hit.some((s) => s.state !== 'open')) return false;
  let cur = from;
  for (const s of hit) { if (toMin(s.begin) > cur) return false; cur = Math.max(cur, toMin(s.end)); }
  return cur >= to;
}

// ── 시간표 그리기 ─────────────────────────────────────
const COLS = Array.from({ length: 8 }, (_, i) => ({ begin: hh(6 + i * 2), end: hh(8 + i * 2) })); // 06–22, 2시간 단위
function drawAxis(from, to) {
  $('grid').style.setProperty('--cols', COLS.length);
  const axis = document.createElement('div');
  axis.className = 'axis';
  axis.innerHTML = '<span style="border:0"></span>' + COLS.map((c) => {
    const inRange = toMin(c.begin) < to && toMin(c.end) > from;
    return `<span class="${inRange ? 'in' : ''}">${c.begin.slice(0, 2)}시</span>`;
  }).join('');
  $('grid').append(axis);
}
function rowEl(s, from, to) {
  const row = document.createElement('div');
  row.className = 'row';
  row.dataset.idx = s.idx;
  const name = document.createElement('div');
  name.className = 'name';
  name.innerHTML = `<a target="_blank" rel="noopener"></a>`;
  name.firstChild.href = DETAIL(s.idx);
  name.firstChild.textContent = s.name;
  name.title = s.name;
  row.append(name);
  for (const c of COLS) {
    const cell = document.createElement('div');
    cell.className = 'cell pending' + (toMin(c.begin) < to && toMin(c.end) > from ? ' in' : '');
    cell.dataset.begin = c.begin;
    row.append(cell);
  }
  return row;
}
const LABEL = { open: '예약 가능', booked: '예약됨', closed: '운영 안 함', other: '확인 필요' };
function fillRow(row, slots) {
  for (const cell of row.querySelectorAll('.cell')) {
    const slot = slots.find((s) => s.begin === cell.dataset.begin);
    cell.classList.remove('pending');
    const state = slot?.state ?? 'closed';
    cell.classList.add(state);
    cell.title = `${cell.dataset.begin} ${LABEL[state]}`;
  }
}

// ── 조회 ──────────────────────────────────────────────
$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const date = $('date').value, fromS = $('from').value, toS = $('to').value;
  const from = toMin(fromS), to = toMin(toS);
  const ids = selectedIds();
  if (from >= to) { $('status').innerHTML = '<span class="error">끝 시간을 시작 시간보다 늦게 골라주세요.</span>'; return; }
  if (!ids.length) { $('pick').open = true; $('status').innerHTML = '<span class="error">찾을 구장을 하나 이상 골라주세요.</span>'; return; }
  store.set('date', date); store.set('from', fromS); store.set('to', toS);

  controller?.abort();
  controller = new AbortController();
  const byIdx = Object.fromEntries(stadiums.map((s) => [s.idx, s]));
  const d = new Date(date + 'T00:00');
  const dayLabel = `${d.getMonth() + 1}월 ${d.getDate()}일(${'일월화수목금토'[d.getDay()]}) ${fromS.slice(0, 2)}–${toS.slice(0, 2)}시`;

  $('grid').innerHTML = '';
  drawAxis(from, to);
  const rows = new Map();
  for (const idx of ids) { const r = rowEl(byIdx[idx] ?? { idx, name: `#${idx}` }, from, to); rows.set(idx, r); $('grid').append(r); }
  $('board').hidden = false; $('legend').hidden = false;
  $('verdict').textContent = `${dayLabel} 찾는 중`;
  $('verdictList').innerHTML = '';
  $('go').disabled = true;

  const full = [], failed = [];
  let done = 0;
  const progress = () => { $('status').textContent = `${ids.length}곳 중 ${done}곳 확인${failed.length ? ` · ${failed.length}곳 조회 실패` : ''}`; };
  progress();

  try {
    const res = await fetch(`${API_BASE}/api/check?date=${date}&ids=${ids.join(',')}`, { signal: controller.signal });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error ?? `조회 서버 응답 ${res.status}`);
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buf = '';
    for (;;) {
      const { value, done: end } = await reader.read();
      if (end) break;
      buf += value;
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const msg = JSON.parse(buf.slice(0, nl)); buf = buf.slice(nl + 1);
        const row = rows.get(msg.idx);
        done++;
        if (msg.error) { failed.push(byIdx[msg.idx]?.name ?? msg.idx); row.classList.add('dim'); }
        else {
          fillRow(row, msg.slots);
          if (fullyOpen(msg.slots, from, to)) {
            full.push(msg.idx); row.classList.add('full');
            // 다 비어있는 구장은 위로 올림
            $('grid').insertBefore(row, $('grid').children[full.length]);
            const li = document.createElement('li');
            li.innerHTML = '<a target="_blank" rel="noopener"></a>';
            li.firstChild.href = DETAIL(msg.idx);
            li.firstChild.textContent = byIdx[msg.idx]?.name ?? `#${msg.idx}`;
            $('verdictList').append(li);
          } else row.classList.add('dim');
        }
        progress();
      }
    }
    $('verdict').textContent = full.length ? `${dayLabel}, ${full.length}곳이 비어 있어요` : `${dayLabel}에 내내 비어 있는 구장이 없어요`;
    $('status').textContent = (full.length ? '' : '시간대를 줄이거나 다른 날짜로 찾아보세요. ') +
      (failed.length ? `조회 실패: ${failed.join(', ')}` : '') + ' 예약은 구장 이름을 눌러 예약 사이트에서 진행하세요.';
  } catch (err) {
    if (err.name === 'AbortError') return;
    $('verdict').textContent = '조회를 마치지 못했어요';
    $('status').innerHTML = `<span class="error">${err.message || '서버 연결이 끊겼어요.'} 잠시 뒤 다시 찾아보세요.</span>`;
  } finally {
    $('go').disabled = false;
  }
});

loadStadiums();
</script>
</body>
</html>
